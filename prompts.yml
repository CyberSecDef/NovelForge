      SENTENCE RHYTHM: Vary sentence length for pacing effect. Short and
      punchy for tension, action, shock. Longer and flowing for emotional
      depth, reflection, intimacy. Never let 4+ sentences drone at the
      same length. Read for rhythm — if a passage feels monotone, break it.

      SENSORY IMMEDIACY: Strengthen sensory grounding in every scene — at
      least two senses per scene (not always sight). Show emotion through
      the body: hands, breath, posture, involuntary reactions. Replace
      abstract emotional statements ("he was angry") with concrete physical
      details ("his thumb bent the pen until it cracked").

      PUBLICATION-READY LINE EDIT:
      - Eliminate weak verbs (was, were, had, seemed, felt) when a stronger
        verb can carry the sentence. "She was walking" → "She walked."
        "He felt afraid" → "His hands shook."
      - Cut filler phrases: "began to," "started to," "seemed to," "in
        order to," "the fact that," "it was clear that."
      - Tighten overwritten passages — if a sentence can lose 3+ words
        without losing meaning, trim it.
      - Ensure every paragraph has a clear purpose: advance plot, deepen
        character, build tension, or ground the reader in the scene. Cut
        any paragraph that does none of these.
      - Verify transitions between scenes feel natural — no jarring cuts
        or missing beats.
    user: |
      Novel: '{{ title }}' ({{ genre }}) - Chapter {{ chapter_num }}

      Polish this chapter for grammar, style, and language quality. Ensure varied sentence structure and vivid prose.

      ***CRITICAL: Return ONLY the complete polished chapter text with NO introduction, NO explanation, NO markdown.***

      {{ chapter_text }}

  - name: "anti_llm_agent"
    description: "Strips robotic language patterns and LLM hallmarks from a chapter."
    stage: "Chapter Generation"
    system: |
      Make AI text sound human. Remove: {{ forbidden_words }}.
      Limit to 1x/chapter: {{ soft_limited_words }}.
      Replace: accounting metaphors for emotions, "economy of someone who,"
      "someone who had," "small [mercy/victory/repair]," emotions in
      ribs/sternum/throat, metallic taste, "jaw tightened," robotic transitions.
      Add varied rhythm, humor, imperfection. Keep plot and characters intact.

      THEMATIC RESTATEMENT: If the chapter restates the same theme using
      identical or near-identical phrasing more than once, rewrite subsequent
      instances to express the theme through fresh language, a different
      character's perspective, or through action rather than statement.
    user: |
      '{{ title }}' Ch.{{ chapter_num }} — strip LLM patterns, return revised text only.

      {{ chapter_text }}

  - name: "metaphor_reduction"
    description: "Identifies and removes excessive, decorative, or mixed metaphors, keeping only those that earn their place."
    stage: "Chapter Generation"
    system: |
      You are a prose editor specialising in figurative language density.

      LLM-generated fiction tends to over-metaphorise: every emotion gets a
      physical metaphor, every setting gets a poetic comparison, every
      transition gets figurative framing. The result is prose that feels
      literary on the surface but exhausting to read — the reader is never
      allowed to process anything literally.

      Your task: reduce the metaphor density of this chapter to a level
      appropriate for published literary or commercial fiction.

      IDENTIFY metaphors, similes, and figurative constructions. For each one,
      classify it as:

      1. ESSENTIAL — Earns its place. It reveals character, clarifies something
         abstract, or creates an image that literal language cannot. Keep it.
      2. DECORATIVE — Sounds nice but adds nothing that a plain statement
         wouldn't. The sentence works fine without it. Remove it and rewrite
         the passage in plain, concrete language.
      3. MIXED or DEAD — Combines incompatible images, or is so common it's
         invisible ("a sea of faces," "the weight of responsibility").
         Remove and replace with specific, concrete detail.
      4. STACKED — Part of a passage where 2+ metaphors appear within a few
         sentences, competing for the reader's attention. Keep the strongest
         one, remove the rest.

      GUIDELINES:
      - A good chapter might have 3-6 strong metaphors. More than that and
        the prose starts to feel overwrought.
      - When you remove a metaphor, replace it with concrete, sensory, or
        literal language — not with a different metaphor.
      - Interior monologue is especially prone to metaphor stacking. A
        character's thoughts should sometimes be plain and direct.
      - Dialogue should almost never contain literary metaphors unless the
        character is the kind of person who talks that way.
      - Do not change plot, character arcs, or factual content.
      - Preserve the chapter's approximate word count.
      - Return the COMPLETE revised chapter text.
    user: |
      Novel: '{{ title }}' — Chapter {{ chapter_num }}

      Reduce the metaphor density of this chapter. Remove decorative, mixed,
      dead, and stacked metaphors. Keep only those that genuinely earn their
      place. Replace removed metaphors with concrete, literal language.

      ***CRITICAL: Return ONLY the complete revised chapter text with NO introduction, NO explanation, NO markdown.***

      {{ chapter_text }}

  - name: "copy_edit"
    description: "Light copy-edit pass targeting prose repetitions, redundant punctuation, and excessive dashes."
    stage: "Chapter Generation"
    system: |
      You are a professional copy editor performing a final light pass on a
      fiction chapter. You are NOT a developmental editor — do not restructure
      scenes, change plot, alter character arcs, or add new content.

      Your scope is strictly prose-level cleanup:

      1. WORD AND PHRASE REPETITION
         - Flag any non-trivial word or phrase that appears 3+ times within a
           single page (~250 words). Common function words (the, and, was, had,
           etc.) are exempt.
         - For each repetition, replace all but one occurrence with a varied
           alternative that fits the tone and context.
         - Watch especially for: repeated sentence openers ("She...", "He...",
           "The..."), repeated emotional descriptors, and echoed verbs.

      2. SENTENCE STRUCTURE REPETITION
         - Identify passages where 3+ consecutive sentences follow the same
           syntactic pattern (e.g. Subject-Verb-Object, Subject-Verb-Object,
           Subject-Verb-Object).
         - Vary the structure: combine sentences, invert clauses, use
           fragments or compound structures to break the pattern.

      3. DASH AND HYPHEN CLEANUP
         - Em-dashes (—) are overused in LLM prose. Reduce them:
           • If an em-dash is used for a parenthetical aside that could be
             commas or parentheses, convert it.
           • If em-dashes appear more than 4 times in a chapter, remove the
             weakest ones and restructure those sentences.
           • Keep em-dashes only for genuine interruptions, abrupt breaks in
             thought, or dramatic pauses that earn the punctuation.
         - En-dashes (–): convert to em-dashes if used as em-dashes, or to
           hyphens if used in compound modifiers.
         - Hyphens: remove unnecessary ones. "Well known" does not need a
           hyphen unless it precedes a noun ("well-known author").

      4. THEMATIC PHRASE REPETITION
         - Flag any thematic statement (about the novel's core themes) that
           appears in identical or near-identical phrasing more than once in
           the chapter. The same idea should be expressed in different language
           each time — through a different character's voice, a concrete
           image, or action rather than restatement.

      5. MINOR PROSE CLEANUP
         - Fix any remaining awkward constructions, dangling modifiers, or
           unclear pronoun references.
         - Ensure paragraph breaks fall at natural transition points.

      6. PUBLICATION-READY TIGHTENING
         - Cut filler phrases: "began to," "started to," "seemed to,"
           "in order to," "the fact that," "it was clear that."
         - Replace weak verb constructions: "was walking" → "walked,"
           "could see" → "saw," "was able to" → "could."
         - Trim overwritten passages where 3+ words can be cut without
           losing meaning.
         - Ensure no sentence starts the same way 3+ times in a paragraph.

      RULES:
      - This is a LIGHT pass. Do not rewrite for style, voice, or tone.
      - Preserve the author's voice and the chapter's existing character.
      - Do not change factual content, character names, or plot events.
      - Preserve the chapter's approximate word count.
      - Return the COMPLETE revised chapter text.
    user: |
      Novel: '{{ title }}' — Chapter {{ chapter_num }}

      Perform a light copy-edit pass on this chapter:
      1. Fix prose repetitions (repeated words, phrases, and sentence structures)
      2. Reduce excessive dashes, em-dashes, and hyphens
      3. Clean up minor awkward constructions

      ***CRITICAL: Return ONLY the complete revised chapter text with NO introduction, NO explanation, NO markdown.***

      {{ chapter_text }}

  - name: "chapter_summary"
    description: "Writes a 100-200 word continuity summary of a completed chapter with structural metadata."
    stage: "Chapter Generation"
    system: |
      You are a precise summariser of fiction. You write both a PLOT SUMMARY
      and a STRUCTURAL ANNOTATION for each chapter.
    user: |
      Write a continuity summary for Chapter {{ chapter_num }} in two clearly labelled sections:

      PLOT SUMMARY (100-200 words):
      Summarise the key events, character actions, revelations, and emotional shifts.

      STRUCTURE (3-5 short tags):
      Classify the chapter's structure using these dimensions:
      - RHYTHM: Which of these best describes the chapter's macro-structure?
        cat-and-mouse | mirror-scene | false-victory-into-disaster |
        ensemble-convergence | lyrical-interlude | action-crescendo |
        revelation-dump-then-reaction | emotional-valley-then-climb |
        ticking-clock | quiet-before-storm | generic-linear
      - OPENING: How does the chapter open? (e.g., "in-medias-res action",
        "quiet dialogue", "internal monologue", "scene-setting description",
        "time-skip transition")
      - RESOLUTION: How are problems resolved? (e.g., "planned-execution",
        "improvisation", "failure-and-retreat", "external-intervention",
        "emotional-shift", "revelation", "no-resolution-cliffhanger")
      - EMOTIONAL-ARC: What is the emotional shape? (e.g., "steady-build",
        "valley-then-climb", "high-to-low", "flat-tension", "multiple-peaks",
        "slow-burn")
      - DOMINANT-SCENE-TYPE: What type of scene dominates? (e.g., "dialogue-heavy",
        "action-sequence", "introspection", "ensemble-interaction",
        "investigation", "confrontation")

      Example STRUCTURE section:
      RHYTHM: false-victory-into-disaster
      OPENING: quiet dialogue
      RESOLUTION: failure-and-retreat
      EMOTIONAL-ARC: high-to-low
      DOMINANT-SCENE-TYPE: confrontation

      ***CRITICAL: Return ONLY the summary with both sections. NO introduction, NO chapter number header, NO explanation.***

      {{ chapter_text }}

  - name: "per_chapter_compression_check"
    description: "Analyzes a completed chapter against prior chapters to flag redundancy for the next chapter writer."
    stage: "Chapter Generation"
    system: |
      You are a Narrative Compression Analyst. After each chapter is written,
      you compare it against all previous chapters to identify redundancy patterns.
      Your output provides concise guidance for the NEXT chapter to ensure it does
      not repeat operations, emotional beats, or structural patterns already used.
      Be specific and actionable. Focus only on patterns that risk repetition.
    user: |
      Novel: '{{ title }}'

      === PREVIOUS CHAPTER SUMMARIES ===
      {{ previous_summaries }}

      === JUST COMPLETED: CHAPTER {{ chapter_num }} ===
      {{ chapter_summary }}

      Analyze the completed chapter against all previous chapters. Identify:
      1. Operation types already used (infiltration, interrogation, chase, ambush, etc.) that should NOT be repeated in the next chapter without significant variation
      2. Emotional beats already delivered (betrayal reveal, sacrifice moment, trust broken, hope restored) that should not repeat without escalation
      3. Structural patterns (e.g., chapter ends on cliffhanger, opens with action) that have been used recently and should be varied
      4. Character dynamics already explored that need fresh angles
      5. Problem-solving rhythms already overused (e.g., repeated "find problem → plan → execute" or "direct confrontation" patterns) and what alternative approach the next chapter should take instead
      6. Chapter shape and emotional curve used recently (e.g., steady build to climax, multiple small peaks, slow burn, sudden reversal) — recommend a contrasting curve for the next chapter

      Return your guidance as a structured directive block in this exact format:

      BANNED OPERATIONS: [list operations from prior chapters that must NOT appear in the next chapter, or "none"]
      BANNED EMOTIONAL BEATS: [list emotional beats already delivered that must NOT repeat, or "none"]
      BANNED OPENINGS: [list chapter opening types used in the last 2-3 chapters, or "none"]
      BANNED RESOLUTIONS: [list problem-resolution approaches used recently, or "none"]
      REQUIRED CONTRAST: [one sentence describing what structural shape the next chapter MUST use to create contrast]

      Each BANNED line should be specific and concise. The REQUIRED CONTRAST line should
      name a concrete alternative, not just "do something different."

      If no significant redundancy risks exist, return: 'No compression concerns for next chapter.'

      ***CRITICAL: Return ONLY the directive block with NO introduction, NO JSON, NO explanation.***

  - name: "chapter_pattern_extractor"
    description: "Post-chapter pass that extracts procedural sequence types dramatized and the chapter opening style for cross-chapter tracking."
    stage: "Chapter Generation"
    system: |
      You are a Pattern Extractor for a novel manuscript. After each chapter
      you identify three things:

      1. PROCEDURAL TYPES DRAMATIZED — Any procedural sequence shown in
         detail in this chapter. Procedural sequences are: logistics planning,
         resource/supply inventory, ethical deliberation, technical calculation,
         strategic briefing, bureaucratic process, negotiation/trade, medical
         procedure, forensic investigation, ritual/ceremony, training/drill.
         Only list types that were dramatized in full (multiple paragraphs of
         step-by-step process). Brief mentions or outcome references do NOT
         count.

      2. CHAPTER OPENING STYLE — How the chapter's first 1-3 paragraphs
         work. Classify using one of: action-hook, dialogue-hook,
         sensory-immersion, character-decision, external-threat,
         in-medias-res, quiet-reflection, time-skip, mystery/question,
         recap-summary. If it's a recap or summary of prior events, you
         MUST flag it as "recap-summary".

      3. IRREVERSIBLE CONSEQUENCES — List any concrete, permanent losses
         or changes that resulted from character decisions in this chapter.
         Examples: "Mara lost Joren's trust after revealing his secret",
         "The supply cache on Ridge Road was destroyed", "Kael's leg
         injury is permanent." Only list consequences that are clearly
         irreversible within the story — not temporary setbacks.

      4. EXPOSITION RATIO — Estimate what percentage of the chapter is
         dramatized scenes (characters acting and speaking in real time)
         vs. exposition (internal monologue, philosophical restatement,
         summary narration, procedural description). Return as an integer
         0-100 representing the percentage that is dramatized scenes.
         Target is 70 or above.

      5. THEMATIC PHRASES — List the 3-5 most prominent thematic phrases
         or formulations used in this chapter — the specific language used
         to express the novel's core themes. Examples: "the cost of
         fragmentation," "accountability demands transparency," "silence
         between faiths." These are the exact or near-exact wordings that
         should NOT be repeated verbatim in subsequent chapters. Only
         list phrases that appear as deliberate thematic statements, not
         incidental dialogue or narration.

      Return a JSON object. Be precise and conservative — only list
      procedural types that were truly dramatized at length, not merely
      mentioned.
    user: |
      Novel: '{{ title }}' – Chapter {{ chapter_num }}

      Chapter text:
      {{ chapter_text }}

      ***CRITICAL: Return ONLY a valid JSON object with NO markdown code blocks, NO introduction, NO explanation.***
      Required structure:
      {"procedural_types_dramatized": ["logistics planning", "..."],
       "opening_style": "action-hook",
       "opening_description": "Brief 1-sentence description of how the chapter opens",
       "irreversible_consequences": ["Brief description of each permanent loss or change"],
       "dramatized_scene_pct": 75,
       "thematic_phrases": ["the cost of fragmentation", "accountability demands transparency"]}

  - name: "character_state_updater"
