      {%- endif %}

      Review this chapter for BOTH redundancy and escalation. Specifically:

      REDUNDANCY:
      - repeated operations that feel too similar to earlier chapters
      - duplicate sacrifice, escape, interrogation, or infiltration beats
      - scenes that restate an emotional point without escalating it
      - sequences that can be compressed into fewer, stronger events

      ESCALATION:
      - stakes that feel equal to or lower than a prior chapter
      - tension that resolves too comfortably without raising new pressure
      - protagonist emerging without meaningful cost or new vulnerability
      - emotional stakes that repeat without escalating
      - missed opportunities to force harder choices or sharper consequences

      Revise the chapter so it is distinct from prior chapters AND meets the escalation target: {{ escalation_target }}.

      ***CRITICAL: Return ONLY the complete revised chapter text with NO introduction, NO explanation, NO markdown.***

      {{ chapter_text }}

  - name: "human_oddities"
    description: "Injects 1-2 small, human, non-plot-serving moments per chapter to break the pattern of relentless moral seriousness."
    stage: "Chapter Generation"
    system: |
      You are a texture editor for literary fiction.

      The manuscript is relentlessly serious. Every scene is morally weighted.
      Every observation is significant. Every character action serves the plot.
      This is unrealistic — real humans deflect, joke badly, notice irrelevant
      things, and occasionally do something that doesn't serve the narrative.

      Your task: inject exactly 1 or 2 small "human oddity" moments into
      this chapter. These are tiny, throwaway beats that make the world feel
      lived-in and the characters feel real. Examples:

      - A character notices something completely irrelevant (a stain on the
        ceiling, a bird doing something stupid, a vending machine that takes
        their money).
      - A character makes a bad joke at the wrong moment, or laughs at
        something they shouldn't.
      - A character does something mundane in the middle of tension (adjusts
        a shoe, picks at a label, counts ceiling tiles).
      - A character has a stray thought that has nothing to do with the
        scene (remembering a song, thinking about what to eat, noticing
        they need a haircut).
      - An interaction that's just... human. Awkward small talk, a failed
        attempt at connection, someone saying "sorry" for no reason.

      RULES:
      - Exactly 1 or 2 oddities per chapter. No more. These must be brief —
        a sentence or two, not a paragraph.
      - They should feel natural, not forced. Slip them into existing scenes
        rather than creating new ones.
      - They must NOT advance the plot, reveal theme, or carry symbolic weight.
        The whole point is that they don't mean anything.
      - They should match the character's personality and situation.
      - Do not change plot, character arcs, or factual content.
      - Preserve the chapter's approximate word count.
      - Return the COMPLETE revised chapter text.
    user: |
      Novel: '{{ title }}' — Chapter {{ chapter_num }} of {{ total_chapters }}

      CHARACTER LIST:
